<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fbf8f3">
<title>LINE特典の本棚｜梅光学院</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shelf.css?v=1029h">
<script src="config.js?v=1029h" defer></script>
<script src="shelf.js?v=1029h" defer></script>
</head>
<body>
<div id="intro" aria-hidden="true">
  <div class="intro-inner">
    <span class="intro-line"></span>
    <p class="intro-title">LINE特典の本棚</p>
    <span class="intro-line"></span>
  </div>
</div>

<main class="page">
  <header class="masthead">
    <p class="school">梅光学院 中学校・高等学校 ／ 公式LINE</p>
    <h1>LINE特典の本棚</h1>
    <p class="lead">お届けした特典を、ここにまとめました。<br>トークをさかのぼらずに、いつでも見返せます。</p>
    <nav class="jump" aria-label="棚へ移動">
      <a href="#shelf-line"><span>LINEで届く特典 ↓</span><b id="line-count">合言葉でひらく</b></a>
      <a href="#shelf-guest"><span>説明会の参加者限定 ↓</span><b id="guest-count">全4特典</b></a>
    </nav>
  </header>

  <section class="shelf" id="shelf-line" aria-labelledby="shelf-line-title">
    <div class="shelf-head">
      <p class="shelf-kicker">第一の棚</p>
      <h2 id="shelf-line-title">公式LINEで、順番に届く特典</h2>
      <p class="shelf-note" id="line-note"></p>
    </div>
    <form class="key" id="key-form-line" autocomplete="off">
      <label for="key-input-line">合言葉を入れる</label>
      <div class="key-row">
        <input id="key-input-line" name="key" type="text" inputmode="text" enterkeyhint="go" placeholder="ひらがな・カタカナ・漢字どれでも" maxlength="20">
        <button type="submit">ひらく</button>
      </div>
      <p class="key-msg" id="key-msg-line" role="status"></p>
    </form>
    <ol class="books" id="books-line"></ol>
  </section>

  <section class="shelf shelf-guest" id="shelf-guest" aria-labelledby="shelf-guest-title">
    <div class="shelf-head">
      <p class="shelf-kicker">第二の棚</p>
      <h2 id="shelf-guest-title">説明会に参加した方だけの特典</h2>
      <p class="shelf-note" id="guest-note"></p>
    </div>
    <form class="key" id="key-form-guest" autocomplete="off">
      <label for="key-input-guest">合言葉を入れる</label>
      <div class="key-row">
        <input id="key-input-guest" name="key" type="text" inputmode="text" enterkeyhint="go" placeholder="ひらがな・カタカナ・漢字どれでも" maxlength="20">
        <button type="submit">ひらく</button>
      </div>
      <p class="key-msg" id="key-msg-guest" role="status"></p>
    </form>
    <ol class="books" id="books-guest"></ol>
  </section>

  <section class="next" aria-labelledby="next-title">
    <h2 id="next-title" class="next-title"></h2>
    <a class="cta" id="cta" href="#" target="_blank" rel="noopener noreferrer"></a>
    <p class="cta-note" id="cta-note"></p>
    <a class="line-link" id="line-link" href="#" target="_blank" rel="noopener noreferrer">公式LINEのトークにもどる</a>
  </section>

  <footer class="foot">
    <p>このページは、梅光学院の生徒が作成しています。</p>
  </footer>
</main>

<noscript><p class="noscript">特典を表示するには、JavaScriptを有効にしてください。</p></noscript>
</body>
</html>
